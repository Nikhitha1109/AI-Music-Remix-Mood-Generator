<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Music Remix Studio</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet">

<style>

body{
    background: linear-gradient(
        135deg,
        #0f172a,
        #1e293b,
        #0f172a
    );

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
}

.glass-card{

    width:850px;

    background:rgba(
        255,
        255,
        255,
        0.08
    );

    backdrop-filter:blur(15px);

    border-radius:25px;

    padding:40px;

    box-shadow:
    0px 8px 32px rgba(
        0,
        0,
        0,
        0.35
    );
}

.title{

    font-size:3rem;
    font-weight:bold;

    text-align:center;
}

.music-icon{

    color:#1DB954;
}

.subtitle{

    text-align:center;
    color:#d1d5db;
    margin-bottom:30px;
}

.upload-btn{

    background:#1DB954;
    border:none;

    font-size:18px;
    font-weight:bold;

    padding:12px;
}

.upload-btn:hover{

    background:#18a34a;
    transform:scale(1.03);

    transition:.3s;
}

.feature-box{

    background:rgba(
        255,
        255,
        255,
        0.05
    );

    border-radius:15px;

    padding:15px;

    text-align:center;

    margin-top:15px;
}

.feature-box:hover{

    transform:translateY(-5px);

    transition:.3s;
}

.footer{

    text-align:center;
    margin-top:20px;

    color:#94a3b8;
}

</style>

</head>

<body>

<div class="glass-card">

<h1 class="title">

<i class="fas fa-music music-icon"></i>

AI Music Remix Studio

</h1>

<p class="subtitle">

Upload a song and let AI analyze genre,
detect mood and generate professional remixes.

</p>

<form
action="/upload"
method="POST"
enctype="multipart/form-data">

<div class="mb-3">

<label class="form-label">

🎵 Select Audio File

</label>

<input
type="file"
class="form-control form-control-lg"
name="song"
accept=".mp3,.wav"
required>

</div>

<button
type="submit"
class="btn upload-btn w-100">

<i class="fas fa-upload"></i>

Upload & Analyze

</button>

</form>

<hr>

<div class="row">

<div class="col-md-3">

<div class="feature-box">

🎼

<h6>Genre Detection</h6>

</div>

</div>

<div class="col-md-3">

<div class="feature-box">

😊

<h6>Mood Analysis</h6>

</div>

</div>

<div class="col-md-3">

<div class="feature-box">

🎧

<h6>AI Remixes</h6>

</div>

</div>

<div class="col-md-3">

<div class="feature-box">

📊

<h6>Dashboard</h6>

</div>

</div>

</div>

<div class="footer">

Powered by AI • Flask • Machine Learning

</div>

</div>

</body>

</html>
